<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broker Portal Directory</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mut:#6b6a63;--line:#e3e1d8;--acc:#1f4fd8;--accbg:#e8eefc;--db:#0061ff;--gd:#188038;--cp:#9a6b00;--c21:#d4a017}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#f0eee8;--mut:#9a988f;--line:#33322e;--acc:#8fb0ff;--accbg:#22304f;--db:#6aa0ff;--gd:#5cc27a;--cp:#e0b050;--c21:#f0c040}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{margin:0;font-size:20px}.sub{color:var(--mut);font-size:13px;margin:2px 0 8px}
#q{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.hid{color:var(--mut);font-size:12px;margin-top:6px}.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:4px 10px;border-radius:99px;font:inherit;font-size:12px;cursor:pointer}.chip::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.35}.chip.on{color:var(--ink);border-color:var(--c);background:var(--accbg)}.chip.on::before{opacity:1}.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}
.layout{display:grid;grid-template-columns:250px 1fr;max-width:1250px;margin:0 auto}
nav{position:sticky;top:128px;align-self:start;max-height:calc(100vh - 136px);overflow:auto;padding:10px 8px 20px 16px}
nav h4{margin:14px 10px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
nav button{display:flex;justify-content:flex-start;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:5px 10px;border-radius:8px;font-size:14px;cursor:pointer}
nav button:hover{background:var(--accbg)}nav button.on{background:#e4ecfb;color:var(--ink)}@media(prefers-color-scheme:dark){nav button.on{background:#25324d}}nav button span{opacity:.6;font-size:12px;margin-left:auto}h2.city.cp{border-bottom:1.5px solid rgba(212,160,23,.4);padding-bottom:6px}
main{padding:6px 16px 70px}
.region{margin:30px 0 4px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--line);padding-bottom:4px}
nav h4.rg{cursor:pointer;user-select:none}nav h4.rg:hover{color:var(--ink)}
.cstar{display:inline-block;flex:none;width:3px;height:15px;border-radius:2px;background:var(--mut);opacity:.35;margin:0 9px 0 2px;cursor:pointer;position:relative;align-self:center}.cstar::after{content:'';position:absolute;inset:-4px -6px}.cstar:hover{opacity:1;background:var(--c21)}.cstar.cs-on{background:var(--c21);opacity:1}
.city{margin:18px 0 8px;font-size:19px;display:flex;align-items:baseline;gap:8px}.city small{color:var(--mut);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{position:relative}.card.pd{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.pin{position:absolute;top:8px;right:9px;border:0;background:none;color:var(--mut);padding:0 2px;font-size:15px;line-height:1;cursor:pointer;opacity:.55}.pin:hover{opacity:1;color:#d4a017}.pd .pin{color:#d4a017;opacity:1}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.xs{display:block;font-weight:600;font-size:13px;margin:3px 0 2px;color:var(--ink);text-decoration:none}.xs:hover{color:var(--acc);text-decoration:underline}.xm{color:var(--mut);font-size:11px;margin-bottom:3px}.card h3{margin:0;font-size:15px;line-height:1.3}.bld{color:var(--mut);font-size:12px;margin:1px 0 6px}.card h3+div.sp{height:7px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;margin-top:5px;border-radius:8px;background:var(--accbg);color:var(--ink);text-decoration:none;font-size:13px}
.lk:hover{outline:2px solid var(--acc)}.lk b{font-weight:600}.lk i{font-style:normal;color:var(--mut);font-size:11px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
@media(max-width:760px){.layout{grid-template-columns:1fr}nav{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:10px 16px}nav h4{display:none}nav button{width:auto;white-space:nowrap;border:1px solid var(--line);gap:6px}}
.lk{padding:5px 9px!important;margin-top:4px!important;font-size:12px!important;border-radius:7px!important}.lk i{font-size:10px!important}.dot{width:7px!important;height:7px!important;margin-right:5px!important}

#cb,.nvh{display:none}
@media(max-width:760px){
header{position:static;padding:10px 12px 8px}h1{font-size:18px}.sub{display:none}
header>div:not(.legend){flex-wrap:wrap}
#q{flex:1 1 100%;order:-1;min-width:0;padding:11px 14px}
#ib{flex:1 1 auto;padding:10px 12px}#sort{flex:none;padding:10px 12px!important}
#cb{display:block;width:100%;margin-top:8px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;text-align:left;font-weight:600}
.legend{flex-wrap:wrap;gap:6px;margin:8px 0 0}.chip{flex:none;padding:6px 11px;font-size:13px}
.layout{display:block}
nav{display:none;position:fixed;inset:0;z-index:40;max-height:none;overflow:auto;background:var(--bg);padding:0 14px 40px;gap:0}
body.nv nav{display:block}body.nv{overflow:hidden}
.nvh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:14px 4px 10px;font-size:17px}.nvx{color:var(--acc);font-weight:600;padding:6px 8px;cursor:pointer}
nav h4{display:block;margin:18px 6px 6px;font-size:12px;padding:6px 0}
nav button{width:100%;white-space:normal;border:0;padding:12px 10px;font-size:16px;border-radius:10px}
.cstar::after{inset:-14px -12px}.cstar{margin-right:12px}
main{padding:4px 12px 100px}
.city{font-size:18px}
.pin{top:2px;right:2px;padding:8px 10px;font-size:19px}
.lk{padding:9px 10px!important;font-size:13px!important}
.grid{grid-template-columns:1fr}
}
</style></head><body>
